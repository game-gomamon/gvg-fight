name: Build and Deploy Holyship GvG

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for actions/deploy-pages. contents:read is enough now —
# we no longer commit data.json back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Regenerates data.json + assets/ from etheria_restart.xlsx.
      # These stay in the runner only; they are never committed.
      - name: Build data.json and portraits
        run: python build.py

      - name: Fail early if data.json is missing
        run: test -s data.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
