[build]
  # Regenerates data.json + portraits from etheria_restart.xlsx on every deploy.
  # If the workbook is missing or malformed the build still publishes, using the
  # data.json already committed to the repo — the site never goes down.
  command = "pip install -r requirements.txt && python3 build.py || echo 'build.py skipped; using committed data.json'"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
